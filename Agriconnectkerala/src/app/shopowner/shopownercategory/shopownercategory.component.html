<div class="container mt-4">

    <h3 class="mb-4">
        My Categories
    </h3>

    <div class="row">

        <div class="col-md-4 mb-4"
             *ngFor="let data of categoryArray">

            <div class="card shadow-sm h-100">

                <img
                    [src]="'http://localhost:3000/images/' + data.image"
                    class="card-img-top"
                    style="height:250px; object-fit:cover;">

                <div class="card-body text-center">

                    <h5 class="card-title">
                        {{data.categoryname}}
                    </h5>

              <button
  class="btn"
  [ngClass]="addedCategories.includes(data.categoryid) ? 'btn-secondary' : 'btn-success'"
  [disabled]="addedCategories.includes(data.categoryid)"
  (click)="saveCategory(data.categoryid)">

  {{ addedCategories.includes(data.categoryid) ? 'Added ✓' : 'Add Category' }}

</button>
                </div>

            </div>

        </div>

    </div>

</div>

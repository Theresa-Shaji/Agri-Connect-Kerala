<div class="col-lg-12 stretch-card">
    <div class="card">
        <div class="card-body">
            <h4 class="card-title">Category View</h4>

            <div class="table-responsive pt-3">
                <table class="table table-bordered">
                    <thead>
                        <tr>
                            <th>sl.no</th>
                            <th>Category Name</th>
                            <th>Image</th>
                            <th>Edit</th>
                            <th>Delete</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr class="table-info" *ngFor="let data of categoryArray; let i=index">

                            <td>{{i+1}}</td>

                            <td>{{data.categoryname}}</td>

                            <td>
                                <img
                                    style="width:120px;height:120px;object-fit:cover;border-radius:5px;"
                                    src="http://localhost:3000/images/{{data.image}}">
                            </td>

                           <td>
    <a [routerLink]="['/adminmaster/editcategory', data.categoryid]">
        <button class="btn btn-success">
            <i class="typcn typcn-edit"></i> Edit
        </button>
    </a>
</td>

                            <td>
                                
                                <button class="btn btn-warning"
                                    onclick="return confirm('Are you sure you want to delete?');"
                                    (click)="Deletecategorydata(data.categoryid)">
                                    Delete
                                    <i class="typcn typcn-delete-outline btn-iconappend"></i>
                                </button>
                               
                            </td>

                        </tr>
                    </tbody>

                </table>
            </div>
        </div>
    </div>
</div>

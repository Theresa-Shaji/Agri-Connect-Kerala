<div class="col-lg-12 stretch-card">
    <div class="card">
        <div class="card-body">
            <h4 class="card-title">District View</h4>
            <p class="card-description">
                Add class <code></code>
            </p>
            <div class="table-responsive pt-3">
                <table class="table table-bordered">
                    <thead>
                        <tr>
                            <th>
                                sl.no
                            </th>
                            <th>
                                District name
                            </th>

                            <th>Edit</th>
                            <th>Delete</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="table-info" *ngFor="let data of districtArray,let i=index">
                            <td>
                                {{i+1}}
                            </td>
                            <td>
                                {{data.districtname}}
                            </td>

                           <td>
    <a [routerLink]="['/adminmaster/editdistrict', data.districtid]">
        <button class="btn btn-success">
            <i class="typcn typcn-edit"></i> Edit
        </button>
    </a>
</td>
                            <td>

                                <button class="btn btn-warning"
                                    onclick="return confirm('Are you sure you want to delete?');"
                                    (click)=" Deletedistrictdata(data.districtid)">Delete
                                    <i class="typcn typcn-delete-outline btn-iconappend"></i>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="col-lg-12 stretch-card">
    <div class="card">
        <div class="card-body">

            <h4 class="card-title">SHOP OWNER VERIFICATION</h4>

            <div class="table-responsive pt-3">

                <table class="table table-bordered table-hover">

                    <thead>
                        <tr>
                            <th>Sl No</th>
                            <th>Shop Name</th>
                            <th>Owner Name</th>
                            <th>Email</th>
                            <th>Phone No</th>
                            <th>District</th>
                            <th>Location</th>
                            <th>License No</th>
                            <th>License Document</th>
                            <th>Shop Image</th>
                            <th colspan="2" class="text-center">Action</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr class="table-info"
                            *ngFor="let data of shopownerverificationArray; let i=index">

                            <td>{{i+1}}</td>

                            <td>{{data.shopname}}</td>

                            <td>{{data.ownername}}</td>

                            <td>{{data.email}}</td>

                            <td>{{data.phoneno}}</td>

                            <td>{{data.districtname}}</td>

                            <td>{{data.locationname}}</td>

                            <td>{{data.licenseno}}</td>
<td>
    <a href="http://localhost:3000/images/{{data.licensedocument}}" target="_blank">
        <img
            class="shop-img"
            src="http://localhost:3000/images/{{data.licensedocument}}"
            style="border-radius:0px;">
    </a>
</td>

<td>
    <a href="http://localhost:3000/images/{{data.image}}" target="_blank">
        <img
            class="shop-img"
            src="http://localhost:3000/images/{{data.image}}"
            style="border-radius:0px;">
    </a>
</td>

                            <td>
                                <button type="button"
                                    class="btn btn-success btn-sm"
                                    (click)="acceptshopownerrequest(data.loginid)">
                                    <i class="mdi mdi-check"></i> Accept
                                </button>
                            </td>

                            <td>
                                <button type="button"
                                    class="btn btn-danger btn-sm"
                                    (click)="rejectshopownerrequest(data.loginid)">
                                    <i class="mdi mdi-close"></i> Reject
                                </button>
                            </td>

                        </tr>

                        <tr *ngIf="shopownerverificationArray.length==0">
                            <td colspan="12" class="text-center">
                                No Shop Owner Requests Found
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </div>
    </div>
</div>

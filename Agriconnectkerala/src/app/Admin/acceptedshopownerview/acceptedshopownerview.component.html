<div class="col-lg-12 stretch-card">
    <div class="card">
        <div class="card-body">

            <h4 class="card-title">ACCEPTED SHOP OWNERS</h4>

            <div class="table-responsive pt-3">

                <table class="table table-bordered table-hover">

                    <thead>
                        <tr>
                            <th>Sl No</th>
                            <th>Shop Name</th>
                            <th>Owner Name</th>
                            <th>Email</th>
                            <th>Phone No</th>
                            <th>District</th>
                            <th>Location</th>
                            <th>License No</th>
                            <th>License Document</th>
                            <th>Shop Image</th>
                            <!-- <th>Action</th> -->
                        </tr>
                    </thead>

                    <tbody>

                        <tr class="table-success"
                            *ngFor="let data of acceptedshopownerArray; let i=index">

                            <td>{{i+1}}</td>

                            <td>{{data.shopname}}</td>

                            <td>{{data.ownername}}</td>

                            <td>{{data.email}}</td>

                            <td>{{data.phoneno}}</td>

                            <td>{{data.districtname}}</td>

                            <td>{{data.locationname}}</td>

                            <td>{{data.licenseno}}</td>


                            <td>
                                <a href="http://localhost:3000/images/{{data.licensedocument}}"
                                   target="_blank">

                                    <img class="shop-img"
                                         src="http://localhost:3000/images/{{data.licensedocument}}"
                                         width="80"
                                         height="80">
                                </a>
                            </td>


                            <td>
                                <a href="http://localhost:3000/images/{{data.image}}"
                                   target="_blank">

                                    <img class="shop-img"
                                         src="http://localhost:3000/images/{{data.image}}"
                                         width="80"
                                         height="80">
                                </a>
                            </td>


<!-- <td>
    <button type="button"
        class="btn btn-primary btn-sm">

        <i class="mdi mdi-eye"></i>
        View

    </button>
</td>
                        </tr> -->


                        <tr *ngIf="acceptedshopownerArray.length == 0">

                            <td colspan="11" class="text-center">
                                No Accepted Shop Owners Found
                            </td>

                        </tr>


                    </tbody>

                </table>

            </div>

        </div>
    </div>
</div>
